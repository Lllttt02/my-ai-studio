<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101428"><link rel="manifest" href="manifest.webmanifest"><title>MY AI STUDIO</title><style>body{margin:0;background:#0d1020;color:#f4f5ff;font:16px -apple-system,BlinkMacSystemFont,sans-serif}header{padding:24px 20px;background:linear-gradient(120deg,#302566,#122448)}h1{margin:0;font-size:25px}.sub{color:#b7bce0;font-size:13px}main{padding:18px;max-width:650px;margin:auto}.card{background:#1b2036;border:1px solid #333b60;border-radius:18px;padding:17px;margin-bottom:16px}h2{font-size:17px;margin:0 0 12px}textarea,input,select{box-sizing:border-box;width:100%;background:#11162b;color:white;border:1px solid #525a7c;border-radius:11px;padding:12px;font-size:16px;margin:7px 0}textarea{min-height:120px}button,.btn{border:0;border-radius:12px;background:#8068ff;color:white;font-weight:700;padding:13px 16px;margin:6px 5px 6px 0;font-size:15px;display:inline-block;text-decoration:none;cursor:pointer}.secondary{background:#303c61}.hint{color:#b5bbd5;font-size:13px;line-height:1.6}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{background:#11162b;border-radius:10px;padding:7px;min-width:0}.tile img{width:100%;height:145px;object-fit:contain}.tile button{font-size:12px;padding:9px}#status{min-height:18px;color:#aee8c7}label{font-size:13px;color:#c5c9df}</style></head><body><header><h1>✦ MY AI STUDIO</h1><div class="sub">iPhone向け創作ワークスペース · v0.1</div></header><main><section class="card"><h2>画像生成プロンプト</h2><label for="prompt">作りたい画像を入力</label><textarea id="prompt" placeholder="例：夕暮れの海辺、金色の光、アニメ調の美しい風景"></textarea><label for="style">スタイル</label><select id="style"><option value="アニメ調、繊細な線画">アニメ</option><option value="フォトリアル、自然な光">リアル</option><option value="ゲームCG風、高精細">ゲームCG</option><option value="イラスト、柔らかな色彩">イラスト</option></select><label for="ratio">画面比率</label><select id="ratio"><option>1:1</option><option>2:3</option><option>9:16</option><option>16:9</option></select><button id="copy">プロンプトをコピー</button><a class="btn secondary" href="https://www.seaart.ai/create" target="_blank" rel="noopener noreferrer">SeaArtを開く ↗</a><p class="hint">SeaArtに自動送信はしません。コピー後、SeaArtの入力欄に貼り付けて生成してください。</p><p id="status" aria-live="polite"></p></section><section class="card"><h2>画像の保存・管理</h2><label for="upload">iPhone内の画像を追加</label><input id="upload" type="file" accept="image/*" multiple><p class="hint">画像はこの端末のブラウザ内に保存します。Safariのデータ削除などで消える場合があります。大切な画像は「写真に保存」してください。</p><div id="gallery" class="gallery"></div></section><section class="card"><h2>AIチャット・SeaArt接続</h2><p class="hint">AIチャットとSeaArt API/MCPの直接連携は未接続です。認証情報をこの画面に入力しないでください。4K・8K高画質化も未実装です。</p><a class="btn secondary" href="https://www.seaart.ai/mcp" target="_blank" rel="noopener noreferrer">SeaArt公式MCP案内 ↗</a></section></main><script src="app.js"></script></body></html>
